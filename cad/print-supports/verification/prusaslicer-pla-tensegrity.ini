# PrusaSlicer 2.7 configuration — single-material PLA tensegrity supports.
# Translated from cad/print-supports/bambu-pla-tensegrity-process.json
# (Bambu keys -> Prusa keys) for off-line verification of the recipe.
# Used by the slice command in cad/print-supports/verification/README.md
# to slice a T3-prism STL.

# Printer & filament (generic 0.4 mm PLA on a 256x256 bed - matches Bambu X1C plate)
printer_technology = FFF
gcode_flavor = marlin
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
nozzle_diameter = 0.4
filament_type = PLA
filament_diameter = 1.75
temperature = 220
first_layer_temperature = 220
bed_temperature = 65
first_layer_bed_temperature = 65
extrusion_multiplier = 1
retract_length = 0.8
retract_speed = 35

# Layer & perimeters (0.20 mm Standard equivalent)
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_pattern = grid
fill_density = 15%

# Speeds (conservative; we only care about toolpath geometry)
perimeter_speed = 60
external_perimeter_speed = 30
infill_speed = 80
travel_speed = 150
first_layer_speed = 25

# ---- Support recipe (Bambu -> PrusaSlicer translation) -------------------
# Bambu enable_support=1                  -> support_material
support_material = 1
# Bambu support_type=tree(hybrid)         -> organic tree (PrusaSlicer 2.7+)
support_material_style = organic
# Bambu support_on_build_plate_only=1     -> support_material_buildplate_only
support_material_buildplate_only = 1
# Bambu support_threshold_angle=10        -> support_material_threshold
# (lowered from 40 so near-vertical strut bottoms are flagged as overhangs
#  and supported all the way down — TPU-safe; see verification/README.md)
support_material_threshold = 10
# Bambu support_top_z_distance=0.2        -> support_material_contact_distance
support_material_contact_distance = 0.2
support_material_bottom_contact_distance = 0
# Bambu support_interface_top_layers=2
support_material_interface_layers = 2
support_material_bottom_interface_layers = 0
# Bambu support_interface_pattern=rectilinear
support_material_interface_pattern = rectilinear
support_material_interface_spacing = 0.2
# Bambu tree_support_branch_distance=2.5  -> support_material_spacing
support_material_spacing = 2.5
# Bambu tree_support_tip_diameter=0.8     -> support_tree_tip_diameter
support_tree_tip_diameter = 0.8
# Bambu tree_support_branch_diameter=2.0  -> support_tree_branch_diameter
support_tree_branch_diameter = 2
# Bambu tree_support_branch_angle=40      -> support_tree_angle
support_tree_angle = 40
# Bambu bridge_no_support=1
dont_support_bridges = 1
# Bambu brim_type=outer_only / brim_width=5
brim_type = outer_only
brim_width = 5
brim_separation = 0
